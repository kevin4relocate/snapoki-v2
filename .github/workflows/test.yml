name: Snapoki V2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run real-browser smoke tests
        env:
          SNAPOKI_PREVIEW_SCREENSHOTS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: npm run test:browser
      - name: Upload Loop Universe preview screenshots
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: loop-universe-preview-screenshots
          path: preview-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output.txt
          retention-days: 3
