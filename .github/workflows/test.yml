name: Snapoki V2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output.txt
          retention-days: 3
