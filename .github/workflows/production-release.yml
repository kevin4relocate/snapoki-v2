name: Snapoki Production Release Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Snapoki V2 CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapoki-production-audit
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify live Cloudflare release matches tested main commit
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail
          echo "Expected tested commit: $EXPECTED_COMMIT"
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt/4" | tee -a production-release-audit.log
            if node scripts/verify-production.mjs --url https://snapoki.com --expected-commit "$EXPECTED_COMMIT" > production-release-attempt.log 2>&1; then
              cat production-release-attempt.log | tee -a production-release-audit.log
              {
                echo "## Production matches tested main"
                echo ""
                echo "- Expected commit: \`$EXPECTED_COMMIT\`"
                echo "- Verified routes: World, Animal and Aquarium Loop, guides and hashed assets"
                echo "- Attempts: $attempt"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat production-release-attempt.log | tee -a production-release-audit.log
            if [ "$attempt" -lt 4 ]; then sleep 30; fi
          done
          {
            echo "## Production is stale or unavailable"
            echo ""
            echo "- Expected tested commit: \`$EXPECTED_COMMIT\`"
            echo "- Cloudflare production did not match after 4 attempts."
            echo "- Inspect \`production-release-audit-log\` and the Cloudflare Pages deployment for the production branch."
            echo "- GitHub source CI may be green even while a Pages release is missing."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Upload full production verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-audit-log
          path: production-release-audit.log
          if-no-files-found: warn
          retention-days: 14
